# Pipeline configuration: the ONE place for settings. No notebook hard-codes a catalog, schema,
# threshold, endpoint or ID. Data shape rules live in contracts/, not here.
#
# Notebooks find this file in this order (see 00_setup/ifc_common.py):
#   1. environment variable IFC_PIPELINE_CONFIG (used for local tests)
#   2. notebook widget `config_path`
#   3. <repo root>/config/pipeline_config.yml, next to the notebooks in the workspace / Git folder

environment:
  catalog: workspace                # Unity Catalog catalog (workspace dbc-ba139e62-9140; its metastore has no
                                    # storage root, so a new catalog cannot be created without a storage location)
  schema: portfolio                 # every table, view, function and volume lives in this one schema
  volume: landing                   # Unity Catalog volume that holds the landing zone (data files only)
  # landing_root is derived as /Volumes/{catalog}/{schema}/{volume}.
  # Set it only to override, e.g. a local folder for tests.
  landing_root:
  contracts_dir: ../contracts       # relative to this config file

landing_zone:
  incoming: incoming   # analysts / upstream teams drop files here
  accepted: accepted   # files that passed the schema gate (input to the Raw stage)
  held: held           # files that failed the gate; waiting for a developer
  loaded: loaded       # files successfully loaded into Raw tables (archive)

schema_gate:
  # Column order changes are harmless when reading by column name.
  # true  = allow, record a warning
  # false = treat as a hard stop like any other schema change
  allow_column_reorder: true
  # Similarity (0-1) above which a missing + unexpected column pair is
  # reported as a probable rename, to help the developer diagnose quickly.
  rename_similarity_threshold: 0.6
  # Skip files whose exact content has already been processed.
  skip_already_processed: true

validation:
  # If more than this share of a file's rows would be quarantined, Stage 3 stops WITHOUT replacing the
  # validated tables, so Genie keeps serving the last good data. A high rate usually means a systemic
  # problem (wrong date format, shifted columns) rather than a few bad rows.
  max_quarantine_share: 0.05
  # Save the SQL that Stage 3 generates to <landing_root>/_generated_sql/ for traceability.
  save_generated_sql: true

# --- Business thresholds used in flag rules (referenced as ${...} in the contracts) ---------------
thresholds:
  amount_reconciliation_tolerance_musd: 0.01
  review_overdue_days:            # Active projects only
    rating_5_6: 30
    rating_3_4: 90
    rating_1_2: 180
  review_exemptions: []           # project_url values exempt from periodic review

reporting:
  reference_date: latest_as_of_date   # anchor for "last N years" questions
  year_basis: calendar                # calendar | fiscal (IFC FY = Jul-Jun)

# --- AI components ---------------------------------------------------------------------------------
ai:
  # Any chat model under Serving works; check the exact name in your workspace.
  llm_endpoint: databricks-meta-llama-3-3-70b-instruct
  run_llm_extraction: true          # false = rule-based text features only (no model calls)
  # Rows sent to the model per run. Keep 5 for smoke tests. Set to empty (null) for the full run
  # ONLY with explicit approval: the full run takes ~60 min on a pay-per-token endpoint.
  llm_extraction_limit: 5
  llm_batch_size: 250               # rows per committed batch (progress is saved after each batch)
  llm_parallelism: 32               # parallel model calls
  # Earlier pipeline's LLM results (same cache key), copied once into enriched_llm_extractions so those
  # descriptions are never sent to the model again. Empty = nothing to carry over.
  legacy_llm_cache_table: llm_text_extractions

# --- Serving IDs (workspace-specific) --------------------------------------------------------------
serving:
  # SQL Warehouses -> warehouse -> Connection details. Used by the agent and the app.
  # a7792da7c24287a3 = "Serverless Starter Warehouse" in workspace dbc-ba139e62-9140 (checked 2026-11-13).
  sql_warehouse_id: a7792da7c24287a3
  # From the Genie space URL: .../genie/rooms/<id>. Left empty on purpose: the space is rebuilt on the
  # merged tables in phase 8, then its ID goes here.
  genie_space_id: 01f1dfb2b45c126bb81182a497d5866f   # "IFC Certified Investment Portfolio" in dbc-ba139e62-9140
  # Unity Catalog model name (created in {catalog}.{schema}) for the CFO Decision Advisor agent.
  uc_model_name: cfo_decision_advisor
  # The team's own agents in the app (app/backend/*_agent.py): Databricks-hosted open-weight models (Serving ->
  # Foundation Model API, pay-per-token). Swap a model here; the app also reads IFC_STRESS_AGENT_MODEL from app.yaml.
  # Chosen 2026-11-16 on the stress-test questions: qwen3-next-80b fastest (~5 s) with every figure traced;
  # gpt-oss-120b close; llama-3.3-70b slower and added a filter nobody asked for.
  agents:
    stress_test_model: databricks-qwen3-next-80b-a3b-instruct
    capital_allocation_model: databricks-qwen3-next-80b-a3b-instruct
    # MLflow experiment that receives a trace of every agent run (app + evaluation job). Empty = tracing off.
    mlflow_experiment: /Shared/cloudstruck_agents

# --- Business parameters (also recorded in ref_assumptions) ---------------------------------------
business:
  ecl_loss_rate: 0.60                     # A11: Past Due = default, 60% of disbursed is lost
  q28_allocation_threshold_musd: 1.0      # Q28 reports |alloc_gap_musd| > this (146 projects)
  client_bands:                           # A15
    band_reduce_past_due: 2               # REDUCE_OR_REVIEW if Past Due projects >= this
    band_reduce_distress_share: 0.25      # ... or Past Due + Watchlist share of current exposure >= this
    band_reduce_rating: 4.5               # ... or exposure-weighted risk rating >= this
    band_continue_max_rating: 3           # CONTINUE needs every Active rating <= this
    band_continue_max_closed_loss: 0.05   # ... and closed-at-a-loss share <= this
    band_continue_min_active: 3           # ... and at least this many Active projects
  health_score_weights:                   # sums to 1
    risk_rating: 0.4
    distress: 0.4
    closed_loss: 0.2
  capital_allocation:                     # A23: where IFC should prioritise or be cautious with new commitments
    min_active_projects: 10               # segments (industry, region, industry x region) smaller than this are not ranked
    max_segment_share: 0.25               # concentration: a segment above this share of current exposure is flagged
    # Ranked on four credit metrics from our certified data (rank 1 = best, overall = average rank):
    # distressed share of exposure (Past Due + Watchlist), ECL / exposure (A11), share of closed disbursed exited at a loss,
    # exposure-weighted internal risk rating. External outlooks (A24, config/market_outlook.yml) are shown beside the
    # ranking, never blended into it, so the data view and the market view stay separable.
  early_warning:                          # A22: emerging-risk signals per client (clients with Active projects)
    min_watchlist_projects: 2             # "Multiple Watchlist projects"
    min_active_rating_5_6: 1              # "Internal risk ratings 5-6": Active projects rated 5 or 6
    min_review_overdue: 1                 # "Long time since last review": Active projects overdue (mon_flag_review_overdue)
    min_past_due: 1                       # "Existing Past Due projects"
    concentration_share: 0.5              # "Concentration in one country": top country's share of current exposure
    concentration_min_active: 3           # ... only for clients with at least this many Active projects
    high_priority_min_signals: 3          # HIGH priority = at least this many signals
    medium_priority_min_signals: 2        # MEDIUM = at least this many; otherwise REVIEW

# --- Portfolio-level checks (01_data/06_dq_checks.py) ---------------------------------------------------------
dq_checks:
  control_total_tolerance_musd: 0.05    # allowed difference when dollar totals are reconciled across layers

# First delivery (Oct 2026), computed independently from the source CSVs. Used ONLY by info checks (F*, D90, K07,
# T02) to show how a new delivery compares; nothing blocks on these numbers.
reference_figures:
  projects_rows: 5000
  monitoring_rows: 3768
  total_approved_musd: 742558.66
  amt_loan_musd: 177612.77
  amt_equity_musd: 185967.90
  amt_guarantee_musd: 195285.29
  amt_risk_mgmt_musd: 184150.79
  disbursed_musd: 296667.53
  distinct_project_numbers: 3559
  q28_gap_projects: 146
  rule_new_renewable_projects: 277

# --- Monthly history and trends (01_data/run_monthly_pipeline.py, 07_snapshot_month.py, 08_trends.py) -----------------
# Files are dropped into incoming/YYYY-MM/; the folder name is the reporting month. A re-upload for a month replaces
# that month only. Latest month = highest month with an active load for every source.
trends:
  # A change smaller than this (in % of the earlier value) is reported as "Stable", not Improving/Deteriorating.
  materiality_pct: 2.0
  # Breakdowns computed for every KPI, besides the whole portfolio: label -> column of certified_investment_portfolio.
  dimensions:
    Region: region
    Industry: industry
    Product line: product_line
    Department: department
  # Each KPI is one SQL aggregate over certified_investment_portfolio_history rows of a month.
  # better: higher | lower | neutral (neutral = reported as Up/Down, never as good or bad).
  kpis:
    - {id: G01, category: Growth, name: Projects in portfolio, unit: projects, better: neutral, sql: "count(*)"}
    - {id: G02, category: Growth, name: Active projects, unit: projects, better: higher, sql: "count_if(status = 'Active')"}
    - {id: G03, category: Growth, name: Board-approved investment, unit: USD M, better: higher,
       sql: "sum(CASE WHEN is_board_approved THEN total_approved_musd ELSE 0 END)"}
    - {id: G04, category: Growth, name: Committed investment (signed and not Dropped), unit: USD M, better: higher,
       sql: "sum(CASE WHEN is_committed THEN total_approved_musd ELSE 0 END)"}
    - {id: G05, category: Growth, name: Disbursed to date, unit: USD M, better: higher, sql: "sum(coalesce(disbursed_musd, 0))"}
    - {id: G06, category: Growth, name: Unsigned pipeline (Pending), unit: USD M, better: neutral, sql: "sum(pipeline_unsigned_musd)"}
    - {id: E01, category: Exposure, name: Current disbursed exposure (Active), unit: USD M, better: neutral,
       sql: "sum(current_disbursed_exposure_musd)"}
    - {id: E02, category: Exposure, name: Undisbursed commitments, unit: USD M, better: neutral, sql: "sum(undisbursed_commitment_musd)"}
    - {id: R01, category: Credit risk, name: Past Due projects, unit: projects, better: lower,
       sql: "count_if(performance_status = 'Past Due')"}
    - {id: R02, category: Credit risk, name: Watchlist projects, unit: projects, better: lower,
       sql: "count_if(performance_status = 'Watchlist')"}
    - {id: R03, category: Credit risk, name: Disbursed in Past Due or Watchlist projects, unit: USD M, better: lower,
       sql: "sum(CASE WHEN performance_status IN ('Past Due', 'Watchlist') THEN coalesce(disbursed_musd, 0) ELSE 0 END)"}
    - {id: R04, category: Credit risk, name: Expected credit loss (A11), unit: USD M, better: lower, sql: "sum(expected_credit_loss_musd)"}
    - {id: R05, category: Credit risk, name: Category A projects Past Due or on Watchlist (WS2), unit: projects, better: lower,
       sql: "count_if(environmental_category = 'A' AND performance_status IN ('Past Due', 'Watchlist'))"}
    - {id: R06, category: Credit risk, name: Exposure-weighted risk rating (Active), unit: rating 1-6, better: lower,
       sql: "sum(current_disbursed_exposure_musd * internal_risk_rating) / nullif(sum(current_disbursed_exposure_musd), 0)"}
    - {id: R07, category: Credit risk, name: Share of Active exposure rated 5-6, unit: '%', better: lower,
       sql: "100 * sum(CASE WHEN internal_risk_rating >= 5 THEN current_disbursed_exposure_musd ELSE 0 END) / nullif(sum(current_disbursed_exposure_musd), 0)"}
    - {id: M01, category: Monitoring discipline, name: Reviews overdue (A18), unit: projects, better: lower,
       sql: "count_if(mon_flag_review_overdue)"}
    - {id: M02, category: Monitoring discipline, name: Pending projects past their Board date (A19), unit: projects, better: lower,
       sql: "count_if(flag_board_date_passed)"}
    - {id: D01, category: Data quality, name: Projects needing data review, unit: projects, better: lower, sql: "count_if(needs_review)"}
    - {id: D02, category: Data quality, name: Projects with a high-severity data issue, unit: projects, better: lower,
       sql: "count_if(dq_max_severity = 'high')"}
    - {id: D03, category: Data quality, name: Records not refreshed this cycle, unit: projects, better: lower,
       sql: "count_if(flag_outdated_record)"}
    - {id: I01, category: Impact, name: New renewable capacity (Active and Closed), unit: MW, better: higher,
       sql: "sum(CASE WHEN status IN ('Active', 'Closed') THEN coalesce(new_capacity_mw, 0) ELSE 0 END)"}
    - {id: I02, category: Impact, name: Climate-related share of Active exposure, unit: '%', better: higher,
       sql: "100 * sum(CASE WHEN is_climate_related THEN current_disbursed_exposure_musd ELSE 0 END) / nullif(sum(current_disbursed_exposure_musd), 0)"}
