<text x="421.0" y="348.0" font-size="13" font-weight="600" fill="#a3171c" text-anchor="middle">Structure problem: file held,</text>
<text x="421.0" y="365.6" font-size="13" font-weight="600" fill="#a3171c" text-anchor="middle">job stops, data owner emailed</text>
<path d="M931.0 292 L931.0 317" fill="none" stroke="#e08a2e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah_e08a2e)"/>
<rect x="820.0" y="322" width="222" height="64" rx="12" fill="#fff5e6" stroke="#e08a2e" stroke-width="1.4"/>
<text x="931.0" y="348.0" font-size="13" font-weight="600" fill="#7a4300" text-anchor="middle">Issues queued for the</text>
<text x="931.0" y="365.6" font-size="13" font-weight="600" fill="#7a4300" text-anchor="middle">owning team to fix</text>
<path d="M1186.0 292 L1186.0 317" fill="none" stroke="#e08a2e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah_e08a2e)"/>
<rect x="1075.0" y="322" width="222" height="64" rx="12" fill="#fff5e6" stroke="#e08a2e" stroke-width="1.4"/>
<text x="1186.0" y="348.0" font-size="13" font-weight="600" fill="#7a4300" text-anchor="middle">Uncertain readings sent</text>
<text x="1186.0" y="365.6" font-size="13" font-weight="600" fill="#7a4300" text-anchor="middle">to a human reviewer</text>
<text x="166.0" y="348.0" font-size="13" font-weight="600" fill="#5b6378" text-anchor="middle">Alerts go to the</text>
<text x="166.0" y="365.6" font-size="13" font-weight="600" fill="#5b6378" text-anchor="middle">team that owns the fix</text>
<path d="M258.0 354 L304.0 354" fill="none" stroke="#b8bfd0" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ah)"/>
<rect x="30" y="426" width="1540" height="50" rx="12" fill="#eef2fb" stroke="#c9d5f5" stroke-width="1.5"/>
<text x="800" y="457" font-size="15" fill="#0d1b4c" text-anchor="middle"><tspan font-weight="700">Unity Catalog</tspan><tspan dx="10">certified tables · 24 documented assumptions · lineage · access grants · every answer and agent run audited</tspan></text>
<circle cx="55" cy="525" r="15" fill="#2f66f6"/>
<text x="55" y="530.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="80" y="530" fill="#0d1b4c"><tspan font-size="19" font-weight="700">Agentic intelligence</tspan><tspan font-size="14" fill="#5b6378" dx="14"></tspan></text>
<path d="M300.0 478 L300.0 546" fill="none" stroke="#8a93a8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="110" y="552" width="380" height="150" rx="16" fill="#ffffff" stroke="#2f66f6" stroke-width="2"/>
<text x="300.0" y="586.0" font-size="18" font-weight="700" fill="#0d1b4c" text-anchor="middle">Genie</text>
<text x="300.0" y="612.0" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">“What happened?”</text>
<text x="300.0" y="640.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Plain-language questions</text>
<text x="300.0" y="657.5" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">turned into SQL on the</text>
<text x="300.0" y="675.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">certified tables</text>
<path d="M800.0 478 L800.0 546" fill="none" stroke="#8a93a8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="610" y="552" width="380" height="150" rx="16" fill="#ffffff" stroke="#2f66f6" stroke-width="2"/>
<text x="800.0" y="586.0" font-size="18" font-weight="700" fill="#0d1b4c" text-anchor="middle">Stress-test agent</text>
<text x="800.0" y="612.0" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">“What if credit worsens?”</text>
<text x="800.0" y="640.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Runs downside scenarios</text>
<text x="800.0" y="657.5" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">on reserves and expected</text>
<text x="800.0" y="675.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">credit loss</text>
<path d="M1300.0 478 L1300.0 546" fill="none" stroke="#8a93a8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1110" y="552" width="380" height="150" rx="16" fill="#ffffff" stroke="#2f66f6" stroke-width="2"/>
<text x="1300.0" y="586.0" font-size="18" font-weight="700" fill="#0d1b4c" text-anchor="middle">Capital allocation agent</text>
<text x="1300.0" y="612.0" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">“Where should new money go?”</text>
<text x="1300.0" y="640.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Ranks sectors and regions</text>
<text x="1300.0" y="657.5" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">with portfolio data and</text>
<text x="1300.0" y="675.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">cited market research</text>
<text x="800" y="728.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Guardrails on all three: figures come only from governed SQL, never from the model · trust check Green / Amber / Red · open-weight model on Databricks</text>
