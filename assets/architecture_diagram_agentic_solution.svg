<text x="420.0" y="825.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="450.0" y="790" width="700" height="104" rx="18" fill="url(#g)" stroke="#1d4ed8" stroke-width="2"/>
<text x="800" y="828.0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Decision brief for the CFO Office and Board</text>
<text x="800" y="856.0" font-size="14" font-weight="400" fill="#e8eeff" text-anchor="middle">What happened + the downside + where to allocate, in one view:</text>
<text x="800" y="874.9" font-size="14" font-weight="400" fill="#e8eeff" text-anchor="middle">which clients to back, which to review</text>
