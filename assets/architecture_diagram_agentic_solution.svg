<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a93a8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f66f6"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f66f6"/><stop offset="1" stop-color="#5b3df5"/></linearGradient><marker id="ah_e5484d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker><marker id="ah_e08a2e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e08a2e"/></marker></defs>
<rect width="1600" height="1010" fill="#ffffff"/>
<text x="40" y="46.0" font-size="24" font-weight="700" fill="#0d1b4c" text-anchor="start">Cloudstruck · from a monthly data delivery to a Board decision</text>
<text x="40" y="72.0" font-size="15" font-weight="400" fill="#5b6378" text-anchor="start">IFC CFO Office portfolio intelligence on Databricks</text>
<circle cx="55" cy="117" r="15" fill="#2f66f6"/>
<text x="55" y="122.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="80" y="122" fill="#0d1b4c"><tspan font-size="19" font-weight="700">Data pipeline</tspan><tspan font-size="14" fill="#5b6378" dx="14">Databricks Jobs, every month · nothing reaches the agents until it is certified</tspan></text>
<rect x="30" y="140" width="1540" height="268" rx="18" fill="#f5f8ff" stroke="#dbe4fb" stroke-width="1.5"/>
<rect x="55" y="162" width="222" height="128" rx="14" fill="#ffffff" stroke="#c9d5f5" stroke-width="1.6"/>
<text x="166.0" y="194.0" font-size="16" font-weight="700" fill="#0d1b4c" text-anchor="middle">Incoming data</text>
<text x="166.0" y="220.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Monthly files land in a</text>
<text x="166.0" y="237.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Unity Catalog volume:</text>
<text x="166.0" y="255.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">structured tables +</text>
<text x="166.0" y="272.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">free-text descriptions</text>
<rect x="310" y="162" width="222" height="128" rx="14" fill="#ffffff" stroke="#c9d5f5" stroke-width="1.6"/>
<text x="421.0" y="194.0" font-size="16" font-weight="700" fill="#0d1b4c" text-anchor="middle">Schema gate</text>
<text x="421.0" y="220.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Every column checked</text>
<text x="421.0" y="237.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">against its data contract</text>
<text x="421.0" y="255.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">before anything loads</text>
<path d="M280 226.0 L305 226.0" fill="none" stroke="#2f66f6" stroke-width="2.2" marker-end="url(#ahb)"/>
<rect x="565" y="162" width="222" height="128" rx="14" fill="#ffffff" stroke="#c9d5f5" stroke-width="1.6"/>
<text x="676.0" y="194.0" font-size="16" font-weight="700" fill="#0d1b4c" text-anchor="middle">Raw</text>
<text x="676.0" y="220.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Each delivery kept</text>
<text x="676.0" y="237.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">exactly as received,</text>
<text x="676.0" y="255.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">full history</text>
<path d="M535 226.0 L560 226.0" fill="none" stroke="#2f66f6" stroke-width="2.2" marker-end="url(#ahb)"/>
<rect x="820" y="162" width="222" height="128" rx="14" fill="#ffffff" stroke="#c9d5f5" stroke-width="1.6"/>
<text x="931.0" y="194.0" font-size="16" font-weight="700" fill="#0d1b4c" text-anchor="middle">Validate</text>
<text x="931.0" y="220.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">Types and business rules;</text>
<text x="931.0" y="237.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">unusable rows quarantined,</text>
<text x="931.0" y="255.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">issues flagged with an owner</text>
<path d="M790 226.0 L815 226.0" fill="none" stroke="#2f66f6" stroke-width="2.2" marker-end="url(#ahb)"/>
<rect x="1075" y="162" width="222" height="128" rx="14" fill="#ffffff" stroke="#c9d5f5" stroke-width="1.6"/>
<text x="1186.0" y="194.0" font-size="16" font-weight="700" fill="#0d1b4c" text-anchor="middle">Enrich with AI</text>
<text x="1186.0" y="220.0" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">An LLM turns free-text</text>
<text x="1186.0" y="237.6" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">descriptions into fields</text>
<text x="1186.0" y="255.1" font-size="13" font-weight="400" fill="#5b6378" text-anchor="middle">(capacity, product, renewable)</text>
<path d="M1045 226.0 L1070 226.0" fill="none" stroke="#2f66f6" stroke-width="2.2" marker-end="url(#ahb)"/>
<rect x="1330" y="162" width="222" height="128" rx="14" fill="#2f66f6" stroke="#2f66f6" stroke-width="1.6"/>
<text x="1441.0" y="194.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Certify</text>
<text x="1441.0" y="220.0" font-size="13" font-weight="400" fill="#e8eeff" text-anchor="middle">One governed row per project,</text>
<text x="1441.0" y="237.6" font-size="13" font-weight="400" fill="#e8eeff" text-anchor="middle">72 reconciliation checks:</text>
<text x="1441.0" y="255.1" font-size="13" font-weight="400" fill="#e8eeff" text-anchor="middle">nothing lost or double counted</text>
<path d="M1300 226.0 L1325 226.0" fill="none" stroke="#2f66f6" stroke-width="2.2" marker-end="url(#ahb)"/>
<path d="M421.0 292 L421.0 317" fill="none" stroke="#e5484d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah_e5484d)"/>
