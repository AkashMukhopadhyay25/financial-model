<!doctype html><html><head><meta charset="utf-8"><style>
/* Closing slide (10 s): the Cloudstruck mark (same art as the app logo) is struck by lightning, then the wordmark,
   tagline and team appear, and the frame fades to black. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07040f;font-family:Inter,sans-serif;color:#efeaff}
#bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 42%,#1d2a7a 0%,transparent 65%),radial-gradient(1200px 700px at 15% 0%,#2a1150 0%,transparent 60%),#07040f}
#grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:60px 60px;animation:pan 10s linear both}
@keyframes pan{to{background-position:0 40px}}
.k{opacity:0;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes tile{0%{opacity:0;transform:scale(.4) rotate(-8deg)}70%{opacity:1;transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes cloud{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes bolt{0%{opacity:0;transform:translateY(-16px) scale(1.25)}35%{opacity:1;transform:none}50%{opacity:.35}65%{opacity:1}80%{opacity:.6}100%{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0}12%{opacity:.55}100%{opacity:0}}
@keyframes ring{from{opacity:.9;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(2.6)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
@keyframes letter{from{opacity:0;transform:translateY(40px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes line{from{opacity:1;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 30px #5b86f766)}50%{filter:drop-shadow(0 0 70px #ffd27a88)}}
@keyframes black{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-120px)}}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.word{font-size:150px;font-weight:750;letter-spacing:-4px;display:flex;margin-top:46px}
.word span{display:inline-block;background:linear-gradient(90deg,#c9d6ff,#5b86f7 45%,#ffd27a);-webkit-background-clip:text;color:transparent;background-size:1100px 100%}
.tag{font-size:34px;color:#b9c3e8;margin-top:18px}
.team{font-size:24px;color:#9aa3c7;margin-top:14px;letter-spacing:.5px}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#9fb4ff}
</style></head><body><div id="bg"></div><div id="grid"></div>
<div id="dots"></div>
<div id="shakeWrap" style="position:absolute;inset:0;animation:shake .35s 2.15s both">
 <div id="stage">
  <div style="position:relative;width:280px;height:280px">
   <div class="k" style="position:absolute;left:50%;top:50%;width:280px;height:280px;border-radius:50%;border:3px solid #ffd27a;animation:ring 1.1s 2.1s both"></div>
   <div class="k" style="position:absolute;left:50%;top:50%;width:280px;height:280px;border-radius:50%;border:2px solid #5b86f7;animation:ring 1.3s 2.3s both"></div>
   <svg class="k" width="280" height="280" viewBox="0 0 48 48" style="animation:tile .9s .5s both, glow 3s 3s infinite">
    <defs>
     <linearGradient id="cs-base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b86f7"/><stop offset=".55" stop-color="#2d45c4"/><stop offset="1" stop-color="#2f8f9a"/></linearGradient>
     <radialGradient id="cs-glow" cx="1" cy="0" r=".75"><stop offset="0" stop-color="#ef8a4c" stop-opacity=".95"/><stop offset="1" stop-color="#ef8a4c" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="48" height="48" rx="12" fill="url(#cs-base)"/>
    <rect width="48" height="48" rx="12" fill="url(#cs-glow)"/>
    <path class="k" d="M14.6 27a6.4 6.4 0 0 1-.4-12.8 8.8 8.8 0 0 1 17-1.6 6.7 6.7 0 0 1 2 14.4z" fill="#fff" style="animation:cloud .7s 1.2s both"/>
    <path class="k" d="M26.4 20.5l-7.6 11.6h5.6l-2.8 10.4 10.2-13.6h-6l3.4-8.4z" fill="#ffd27a" stroke="#2d45c4" stroke-width="1.4" stroke-linejoin="round" style="animation:bolt .7s 2s both;transform-box:fill-box;transform-origin:center"/>
   </svg>
  </div>
  <div class="word" id="word"></div>
  <div class="tag k" style="animation:up .8s 4.3s both">Portfolio intelligence for the IFC CFO Office</div>
  <div class="k" style="width:520px;height:2px;margin-top:34px;background:linear-gradient(90deg,transparent,#5b86f7,#ffd27a,transparent);transform-origin:center;animation:line .9s 5.1s both"></div>
  <div class="team k" style="animation:fade .8s 5.6s both;margin-top:26px">Akash Mukhopadhyay · Pruthvi Doshi · Sneha Chandrasekaran · Ritvik Kohli</div>
  <div class="k" style="animation:fade .8s 6.3s both;margin-top:14px;font-size:20px;color:#7f88ad;letter-spacing:4px;text-transform:uppercase">Built on Databricks</div>
 </div>
</div>
<div class="k" style="position:absolute;inset:0;background:#fff7dc;pointer-events:none;animation:flash .45s 2.1s both"></div>
<div class="k" style="position:absolute;inset:0;background:#000;animation:black 1s 9s both"></div>
<script>
// wordmark letters, one after another
const w = document.getElementById('word');
[...'Cloudstruck'].forEach((ch, i) => {
  const s = document.createElement('span'); s.textContent = ch; s.className = 'k';
  s.style.animation = `letter .55s ${3.0 + i * .07}s both`;
  s.style.backgroundPosition = `${-i * 82}px 0`;
  w.appendChild(s);
});
// slow rising particles (fixed positions, so every render is identical)
const d = document.getElementById('dots');
for (let i = 0; i < 46; i++) {
  const e = document.createElement('div'); e.className = 'dot';
  const x = (i * 397) % 1920, y = 200 + (i * 211) % 900, o = .15 + ((i * 37) % 50) / 100;
  e.style.cssText = `left:${x}px;top:${y}px;opacity:${o};animation:drift ${8 + (i % 5)}s linear 0s both`;
  d.appendChild(e);
}
window.DURATION = 10;
window.render = t => { document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; }); };
render(0);
</script></body></html>
